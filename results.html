<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Results</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-r from-purple-100 via-pink-100 to-blue-100 min-h-screen flex items-center justify-center py-10">

<div class="w-full max-w-3xl mx-auto p-10 bg-white rounded-2xl shadow-2xl">
    <h1 class="text-4xl font-bold text-center text-blue-700 mb-8">Your Recommended Learning Style</h1>

    <div id="resultBox" class="space-y-4"></div>

    <h2 class="text-2xl font-bold text-blue-600 mt-10 mb-4">📺 Recommended YouTube Resources</h2>
    <div id="videoBox" class="grid grid-cols-1 gap-4"></div>
    <p id="videoError" class="text-red-500 text-center hidden">Could not load videos. Please check your connection and try again.</p>
</div>

<script src="config.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
    const container = document.getElementById("resultBox");
    const videoBox = document.getElementById("videoBox");
    const videoError = document.getElementById("videoError");
    const data = JSON.parse(localStorage.getItem("learningResults"));

    if (!data) {
        container.innerHTML = `<p class="text-gray-700 text-center">No results found. Please complete the <a href="questionnaire.html" class="text-blue-600 underline">quiz</a> first.</p>`;
        return;
    }

    // Display main learning style
    const mainCard = document.createElement("div");
    mainCard.className = "bg-gradient-to-r from-blue-400 to-purple-500 text-white p-6 rounded-xl shadow-lg";
    mainCard.innerHTML = `
        <svg class="w-8 h-8 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span class="font-semibold text-lg">${data.mainStyle}</span>
    `;
    container.appendChild(mainCard);

    // Display flagged risks
    const flags = [];
    if (data.scores.dyslexiaRisk >= 3) flags.push("Dyslexia");
    if (data.scores.adhdRisk >= 3) flags.push("ADHD");
    if (data.scores.dyscalculiaRisk >= 3) flags.push("Dyscalculia");
    if (data.scores.dysgraphiaRisk >= 3) flags.push("Dysgraphia");

    flags.forEach(flag => {
        const div = document.createElement("div");
        div.className = "bg-yellow-100 border-l-4 border-yellow-500 p-4 rounded-xl shadow flex items-center";
        div.innerHTML = `
            <svg class="w-6 h-6 text-yellow-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3"></path>
            </svg>
            <span class="font-medium">Possible ${flag} risk detected</span>
        `;
        container.appendChild(div);
    });

    // Button to strategies page
    const btn = document.createElement("a");
    btn.href = "strategies.html";
    btn.className = "inline-block mt-6 w-full text-center bg-gradient-to-r from-purple-500 to-blue-500 text-white py-3 rounded-xl shadow-lg hover:from-blue-500 hover:to-purple-500 transition-all duration-300 font-semibold";
    btn.innerText = "See Recommended Strategies";
    container.appendChild(btn);

    // YouTube API call
    const queries = {
        "Visual Learner": "visual learning strategies for students",
        "Auditory Learner": "auditory learning strategies for students",
        "Kinesthetic Learner": "kinesthetic hands-on learning strategies"
    };

    const query = queries[data.mainStyle] || "learning strategies for students";

    try {
        const response = await fetch(
            `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=3&key=${CONFIG.YOUTUBE_API_KEY}`
        );

        if (!response.ok) throw new Error("API error");

        const result = await response.json();

        if (!result.items || result.items.length === 0) throw new Error("No videos found");

        result.items.forEach(video => {
            const videoId = video.id.videoId;
            const title = video.snippet.title;
            const thumbnail = video.snippet.thumbnails.medium.url;
            const channel = video.snippet.channelTitle;

            const card = document.createElement("div");
            card.className = "bg-white rounded-xl shadow-lg overflow-hidden flex gap-4 p-4 hover:shadow-2xl transition-all duration-300";
            card.innerHTML = `
                <img src="${thumbnail}" alt="${title}" class="w-40 h-24 object-cover rounded-lg flex-shrink-0">
                <div class="flex flex-col justify-center">
                    <p class="font-semibold text-gray-800 text-sm mb-1">${title}</p>
                    <p class="text-gray-500 text-xs mb-2">${channel}</p>
                    <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank"
                        class="text-blue-600 text-xs font-semibold underline hover:text-purple-600">
                        Watch on YouTube →
                    </a>
                </div>
            `;
            videoBox.appendChild(card);
        });

    } catch (err) {
        videoError.classList.remove("hidden");
        console.error("YouTube API error:", err);
    }
});
</script>
</body>
</html>
