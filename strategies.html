<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teaching Strategies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/heroicons@1.0.6/dist/heroicons.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-r from-blue-100 via-purple-100 to-pink-100 min-h-screen flex items-center justify-center py-10">

<div class="w-full max-w-3xl mx-auto p-10 bg-white rounded-2xl shadow-2xl animate-fadeIn">
    <h1 class="text-4xl font-bold text-center text-blue-700 mb-8">Recommended Strategies</h1>

    <div id="strategyBox" class="space-y-4">
        <!-- JS will insert strategy cards here -->
    </div>

    <a href="index.html" class="inline-block mt-6 w-full text-center bg-gradient-to-r from-purple-500 to-blue-500 text-white py-3 rounded-xl shadow-lg hover:from-blue-500 hover:to-purple-500 transition-all duration-300 font-semibold">
        Back to Home
    </a>
</div>

<script src="js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const strategyBox = document.getElementById("strategyBox");
    const data = JSON.parse(localStorage.getItem("learningResults"));
    if (!data) {
        strategyBox.innerHTML = `<p class="text-gray-700 text-center">No results found. Please complete the <a href="questionnaire.html" class="text-blue-600 underline">quiz</a> first.</p>`;
        return;
    }

    const strategies = {
        "Visual Learner": ["Use diagrams & charts", "Watch educational videos", "Use color-coded notes"],
        "Auditory Learner": ["Listen to explanations", "Repeat information aloud", "Use audio recordings"],
        "Kinesthetic Learner": ["Hands-on activities", "Move while learning", "Use real objects or models"]
    };

    const list = strategies[data.mainStyle] || ["No strategies found"];
    list.forEach(s => {
        const card = document.createElement("div");
        card.className = "bg-white p-6 shadow-lg rounded-xl transform hover:-translate-y-1 hover:shadow-2xl transition-all duration-300 flex items-center";
        card.innerHTML = `
            <svg class="w-6 h-6 text-blue-500 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span>${s}</span>
        `;
        strategyBox.appendChild(card);
    });
});
</script>

</body>
</html>
